<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MangaScan Reader - Home</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #181828; color: #eaeaea; margin: 0; min-height: 100vh; }
    header { text-align: center; background: linear-gradient(90deg,#31395b,#16161e 75%); padding: 36px 0 15px 0;}
    h1 { color: #47e4ff; letter-spacing: .04em; }
    #controls { max-width: 600px; margin: 35px auto 0 auto; padding:20px;background:#232345;border-radius:20px;}
    #siteSelect, #searchInput { display: block; margin: 10px auto 16px auto; width: 96%; font-size: 1.12em; border-radius: 7px; border: 1.5px solid #273765; padding: 8px 12px; background: #16172a; color: #f1faff; min-width: 120px; }
    #mangaGrid { max-width: 1200px; margin: 55px auto 0 auto; display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
    .manga-card { background: #232345; border-radius: 16px; box-shadow: 0 4px 22px #09182c60; overflow: hidden; width: 180px; cursor: pointer; border:2px solid #161627; text-decoration:none;color:inherit; transition:all .12s; display: flex; flex-direction: column; min-height: 260px;}
    .manga-card:hover { border:2px solid #47e4ff; transform: translateY(-4px) scale(1.03); box-shadow: 0 10px 50px #0e194a80; background: #232353;}
    .manga-cover { width: 100%; height: 220px; object-fit:cover; background:#111829; }
    .manga-title { font-size: 1.09em; font-weight: 600; letter-spacing:0.01em; color: #48eaff; padding: 15px 10px 8px 10px; text-align:center; flex: 0;}
    @media (max-width:600px) { #mangaGrid { gap: 14px; } .manga-card { width:96vw; max-width:320px; } .manga-cover { height:120px;} }
  </style>
</head>
<body>
<header>
  <h1>MangaScan Reader</h1>
  <div>Complete online manga reader — select scan site, search & read in your preferred style!</div>
</header>
<section id="controls">
  <select id="siteSelect"></select>
  <input id="searchInput" type="text" placeholder="Search manga by name...">
</section>
<section id="mangaGrid"></section>
<script>
  const scanSites = {
    "asura": {
      label: "Asura Scans",
      pattern: "https://cdn.asurascans.com/asura-images/chapters/{manga_slug}/{chapter}/{page}.webp"
    }
  };
  const siteSelect = document.getElementById('siteSelect');
  for (const code in scanSites) {
    const op = document.createElement('option');
    op.value = code;
    op.textContent = scanSites[code].label;
    siteSelect.appendChild(op);
  }
  let allMangas = [];
  let mangas = [];
  let mangaGrid = document.getElementById('mangaGrid');
  fetch('mangas.json').then(r=>r.json()).then(data=>{
    allMangas = data;
    filterMangaList();
  });
  document.getElementById('searchInput').oninput = filterMangaList;
  siteSelect.onchange = filterMangaList;
  function filterMangaList() {
    const site = siteSelect.value;
    const term = document.getElementById('searchInput').value.toLowerCase();
    mangas = allMangas.filter(m => m.site===site && (!term || m.title.toLowerCase().includes(term)));
    mangaGrid.innerHTML = mangas.length === 0 ?
            "<div style='text-align:center;font-size:1.2em;color:#fd3690;margin-top:33px;'>No manga found.</div>"
            : "";
    mangas.forEach(manga => {
      const card = document.createElement('a');
      card.href = `reader.html#site=${site}&slug=${encodeURIComponent(manga.slug)}&chapter=1`;
      card.className = 'manga-card';
      card.innerHTML = `
          <img src="${manga.cover}" class="manga-cover" alt="${manga.title}">
          <div class="manga-title">${manga.title}</div>
        `;
      mangaGrid.appendChild(card);
    });
  }
</script>
</body>
</html>
